<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Writer Assistant - Hub</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    .novel-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
    }
    .novel-cover {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
    }
    .novel-cover-placeholder {
      width: 100%;
      height: 180px;
      background-color: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      border: 1px dashed var(--border-color);
    }
    .novel-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .novel-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .novel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .auth-container {
      max-width: 420px;
      margin: 4rem auto;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .auth-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .auth-tab.active {
      color: var(--accent-primary);
      border-bottom: 2px solid var(--accent-primary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .form-error {
      color: var(--accent-danger);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    #coverPreview {
      max-height: 120px;
      object-fit: contain;
      margin-top: 0.5rem;
      display: none;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="./index.html" class="navbar-brand">
      <span>📖 Novel Writer Assistant</span>
    </a>
    <div class="navbar-actions" id="navActions">
      <span id="userGreeting" style="font-size: 0.875rem; color: var(--text-muted);"></span>
      <button id="logoutBtn" class="btn btn-secondary btn-sm" style="display: none;">Log Out</button>
    </div>
  </header>

  <main class="container">
    <!-- Auth Section (Hidden when logged in) -->
    <div id="authSection" class="auth-container">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">Log In</button>
        <button id="tabRegister" class="auth-tab" type="button">Register</button>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" required autocomplete="username" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="At least 6 characters">
        </div>
        <div id="authError" class="form-error"></div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
      </form>
    </div>

    <!-- Hub Section (Shown when logged in) -->
    <div id="hubSection" style="display: none;">
      <div class="hub-header">
        <div>
          <h2>Your Novels</h2>
          <p style="color: var(--text-muted); font-size: 0.875rem;">Select a novel to enter its toolbox dashboard.</p>
        </div>
        <button id="openCreateModalBtn" class="btn btn-primary">+ Create New Novel</button>
      </div>

      <div id="novelsGrid" class="grid grid-cols-3">
        <!-- Novel cards will be populated here -->
      </div>

      <div id="emptyNovels" class="empty-state" style="display: none;">
        <h3>No novels found</h3>
        <p style="margin-top: 0.5rem;">Click "+ Create New Novel" above to start your first story.</p>
      </div>
    </div>
  </main>

  <!-- Create Novel Modal -->
  <div id="createModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3>Create New Novel</h3>
        <button id="closeCreateModalBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>
      <form id="createNovelForm">
        <div class="form-group">
          <label for="novelTitleInput">Title *</label>
          <input type="text" id="novelTitleInput" required placeholder="Novel title (mandatory)">
        </div>
        <div class="form-group">
          <label for="novelDescInput">Description (Optional)</label>
          <textarea id="novelDescInput" rows="3" placeholder="Brief premise or notes"></textarea>
        </div>
        <div class="form-group">
          <label for="novelCoverInput">Cover Image (Optional, max 5 MB)</label>
          <input type="file" id="novelCoverInput" accept="image/*">
          <img id="coverPreview" alt="Cover Preview">
        </div>
        <div id="createNovelError" class="form-error"></div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" id="cancelCreateBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveNovelBtn" class="btn btn-primary">Create Novel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./api-client.js"></script>
  <script>
    let activeAuthMode = "login";
    let base64CoverData = null;

    // DOM Elements
    const authSection = document.getElementById("authSection");
    const hubSection = document.getElementById("hubSection");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const authForm = document.getElementById("authForm");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const authSubmitBtn = document.getElementById("authSubmitBtn");
    const authError = document.getElementById("authError");
    const userGreeting = document.getElementById("userGreeting");
    const logoutBtn = document.getElementById("logoutBtn");
    const novelsGrid = document.getElementById("novelsGrid");
    const emptyNovels = document.getElementById("emptyNovels");

    // Create Modal DOM
    const openCreateModalBtn = document.getElementById("openCreateModalBtn");
    const closeCreateModalBtn = document.getElementById("closeCreateModalBtn");
    const cancelCreateBtn = document.getElementById("cancelCreateBtn");
    const createModal = document.getElementById("createModal");
    const createNovelForm = document.getElementById("createNovelForm");
    const novelTitleInput = document.getElementById("novelTitleInput");
    const novelDescInput = document.getElementById("novelDescInput");
    const novelCoverInput = document.getElementById("novelCoverInput");
    const coverPreview = document.getElementById("coverPreview");
    const createNovelError = document.getElementById("createNovelError");
    const saveNovelBtn = document.getElementById("saveNovelBtn");

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function showAuthError(message) {
      authError.textContent = message;
      authError.style.display = "block";
    }

    function clearAuthError() {
      authError.textContent = "";
      authError.style.display = "none";
    }

    function getToken() {
      return localStorage.getItem("novel_token");
    }

    function setSession(token, username) {
      localStorage.setItem("novel_token", token);
      localStorage.setItem("novel_username", username);
    }

    function clearSession() {
      localStorage.removeItem("novel_token");
      localStorage.removeItem("novel_username");
      localStorage.removeItem("active_novel_id");
    }

    tabLogin.addEventListener("click", () => {
      activeAuthMode = "login";
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      authSubmitBtn.textContent = "Log In";
      clearAuthError();
    });

    tabRegister.addEventListener("click", () => {
      activeAuthMode = "register";
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      authSubmitBtn.textContent = "Register";
      clearAuthError();
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAuthError();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAuthError("Please fill out both fields.");
        return;
      }

      if (password.length < 6) {
        showAuthError("Password must be at least 6 characters.");
        return;
      }

      authSubmitBtn.disabled = true;
      authSubmitBtn.textContent = "Processing...";

      try {
        const passwordHash = await sha256(password);
        const data = await ApiClient.post("/api/auth", {
          action: activeAuthMode,
          username,
          passwordHash,
        });

        setSession(data.token, data.username);
        initView();
      } catch (err) {
        showAuthError(err.message || "An authentication error occurred.");
      } finally {
        authSubmitBtn.disabled = false;
        authSubmitBtn.textContent = activeAuthMode === "login" ? "Log In" : "Register";
      }
    });

    logoutBtn.addEventListener("click", () => {
      clearSession();
      initView();
    });

    novelCoverInput.addEventListener("change", () => {
      const file = novelCoverInput.files[0];
      if (!file) {
        base64CoverData = null;
        coverPreview.style.display = "none";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        createNovelError.textContent = "Image size exceeds 5MB limit.";
        createNovelError.style.display = "block";
        novelCoverInput.value = "";
        base64CoverData = null;
        coverPreview.style.display = "none";
        return;
      }

      createNovelError.style.display = "none";
      const reader = new FileReader();
      reader.onload = (e) => {
        base64CoverData = e.target.result;
        coverPreview.src = base64CoverData;
        coverPreview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    openCreateModalBtn.addEventListener("click", () => {
      createNovelForm.reset();
      base64CoverData = null;
      coverPreview.style.display = "none";
      createNovelError.style.display = "none";
      createModal.classList.add("active");
    });

    function closeModal() {
      createModal.classList.remove("active");
    }
    closeCreateModalBtn.addEventListener("click", closeModal);
    cancelCreateBtn.addEventListener("click", closeModal);

    createNovelForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      createNovelError.style.display = "none";

      const title = novelTitleInput.value.trim();
      const description = novelDescInput.value.trim();

      if (!title) {
        createNovelError.textContent = "Title is mandatory.";
        createNovelError.style.display = "block";
        return;
      }

      saveNovelBtn.disabled = true;
      saveNovelBtn.textContent = "Creating...";

      try {
        await ApiClient.post("/api/novels", {
          title,
          description,
          coverBase64: base64CoverData,
        });

        closeModal();
        loadNovels();
      } catch (err) {
        createNovelError.textContent = err.message;
        createNovelError.style.display = "block";
      } finally {
        saveNovelBtn.disabled = false;
        saveNovelBtn.textContent = "Create Novel";
      }
    });

    async function loadNovels() {
      try {
        const data = await ApiClient.get("/api/novels");
        const novels = data.novels || [];

        novelsGrid.innerHTML = "";
        if (novels.length === 0) {
          emptyNovels.style.display = "block";
          return;
        }

        emptyNovels.style.display = "none";
        novels.forEach((novel) => {
          const card = document.createElement("div");
          card.className = "card novel-card";
          card.onclick = () => {
            localStorage.setItem("active_novel_id", novel.id);
            window.location.href = `./dashboard.html?id=${novel.id}`;
          };

          const coverHtml = novel.coverBase64
            ? `<img class="novel-cover" src="${novel.coverBase64}" alt="${escapeHtml(novel.title)}">`
            : `<div class="novel-cover-placeholder">No Cover Image</div>`;

          const overviewBadge = novel.hasOverview
            ? `<span class="badge badge-success">AI Ready (500+ words)</span>`
            : `<span class="badge badge-warning">Needs Overview</span>`;

          card.innerHTML = `
            ${coverHtml}
            <h3 class="novel-title">${escapeHtml(novel.title)}</h3>
            <p class="novel-desc">${escapeHtml(novel.description || "No description provided.")}</p>
            <div class="novel-footer">
              <span>${overviewBadge}</span>
              <span>${new Date(novel.updatedAt).toLocaleDateString()}</span>
            </div>
          `;
          novelsGrid.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading novels:", err);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function initView() {
      const token = getToken();
      const username = localStorage.getItem("novel_username");

      if (!token) {
        authSection.style.display = "block";
        hubSection.style.display = "none";
        logoutBtn.style.display = "none";
        userGreeting.textContent = "";
      } else {
        authSection.style.display = "none";
        hubSection.style.display = "block";
        logoutBtn.style.display = "inline-flex";
        userGreeting.textContent = username ? `Signed in as @${username}` : "";
        loadNovels();
      }
    }

    document.addEventListener("DOMContentLoaded", initView);
  </script>
</body>
</html>
