<!-- editor.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Body - Editor</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      overflow: hidden;
      height: 100vh;
    }
    .editor-layout {
      display: flex;
      height: calc(100vh - 61px);
      position: relative;
    }
    /* Sidebar: Chapter List */
    .chapters-sidebar {
      width: 280px;
      min-width: 250px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chapters-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chapters-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0.5rem;
    }
    .chapter-item {
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
      transition: background 0.15s ease;
    }
    .chapter-item:hover {
      background-color: var(--bg-tertiary);
    }
    .chapter-item.active {
      background-color: var(--accent-primary);
      color: #ffffff;
      font-weight: 600;
    }
    /* Main Writing Area */
    .editor-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      position: relative;
    }
    .editor-toolbar {
      padding: 0.75rem 1.5rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .chapter-title-input {
      background: transparent;
      border: 1px solid transparent;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      max-width: 400px;
    }
    .chapter-title-input:focus {
      background-color: var(--bg-primary);
      border-color: var(--border-color);
    }
    .editor-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .editor-textarea-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      overflow-y: auto;
      padding: 2rem 1rem;
    }
    .editor-textarea {
      width: 100%;
      max-width: 800px;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 1.05rem;
      line-height: 1.8;
      resize: none;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .editor-statusbar {
      padding: 0.4rem 1.5rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    /* Find / Search Overlay */
    .find-bar {
      position: absolute;
      top: 55px;
      right: 2rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 0.6rem 0.85rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 30;
    }
    .find-bar.active {
      display: flex;
    }
    .find-input {
      width: 200px;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }
    .find-match-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 45px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a id="navBackDashboard" href="#" class="btn btn-secondary btn-sm">← Dashboard</a>
      <span style="font-weight: 700;">Novel Body</span>
    </div>
    <div class="navbar-actions">
      <button id="toggleFindBtn" class="btn btn-secondary btn-sm" title="Search text (Ctrl+F)">🔍 Find</button>
      <button id="deleteChapterBtn" class="btn btn-danger btn-sm" title="Delete Active Chapter">Delete Chapter</button>
    </div>
  </header>

  <div class="editor-layout">
    <!-- Chapter Switcher Sidebar -->
    <aside class="chapters-sidebar">
      <div class="chapters-header">
        <span style="font-weight: 600; font-size: 0.9rem;">Chapters</span>
        <button id="addChapterBtn" class="btn btn-primary btn-sm">+ New</button>
      </div>
      <ul id="chaptersList" class="chapters-list">
        <!-- Chapters populated dynamically -->
      </ul>
    </aside>

    <!-- Main Text Editor -->
    <main class="editor-main">
      <!-- Find Bar Tool -->
      <div id="findBar" class="find-bar">
        <input type="text" id="findInput" class="find-input" placeholder="Find in chapter...">
        <span id="findMatchCount" class="find-match-count">0/0</span>
        <button id="findPrevBtn" class="btn btn-secondary btn-sm" type="button" title="Previous match">▲</button>
        <button id="findNextBtn" class="btn btn-secondary btn-sm" type="button" title="Next match">▼</button>
        <button id="closeFindBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>

      <div class="editor-toolbar">
        <input type="text" id="chapterTitleInput" class="chapter-title-input" placeholder="Chapter Title">
        <div class="editor-actions">
          <span id="saveIndicator" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">All changes saved</span>
        </div>
      </div>

      <div class="editor-textarea-container">
        <textarea id="chapterBody" class="editor-textarea" placeholder="Start drafting your novel chapter here..."></textarea>
      </div>

      <div class="editor-statusbar">
        <div>
          <span id="statusWordCount">0 words</span> | 
          <span id="statusCharCount">0 characters</span>
        </div>
        <div id="statusLastSaved">Unsaved</div>
      </div>
    </main>
  </div>

  <script src="./api-client.js"></script>
  <script src="./chatbot.js"></script>
  <script>
    // Merged Editor UI & Robust Autosave Engine
    (function () {
      const novelId = ApiClient.getNovelId();
      if (!novelId) {
        window.location.href = "./index.html";
        return;
      }

      const elements = {
        navBackDashboard: document.getElementById("navBackDashboard"),
        chaptersList: document.getElementById("chaptersList"),
        chapterTitleInput: document.getElementById("chapterTitleInput"),
        chapterBody: document.getElementById("chapterBody"),
        saveIndicator: document.getElementById("saveIndicator"),
        statusWordCount: document.getElementById("statusWordCount"),
        statusCharCount: document.getElementById("statusCharCount"),
        statusLastSaved: document.getElementById("statusLastSaved"),
        addChapterBtn: document.getElementById("addChapterBtn"),
        deleteChapterBtn: document.getElementById("deleteChapterBtn"),
        toggleFindBtn: document.getElementById("toggleFindBtn"),
        closeFindBtn: document.getElementById("closeFindBtn"),
        findBar: document.getElementById("findBar"),
        findInput: document.getElementById("findInput"),
        findMatchCount: document.getElementById("findMatchCount"),
        findPrevBtn: document.getElementById("findPrevBtn"),
        findNextBtn: document.getElementById("findNextBtn"),
      };

      elements.navBackDashboard.href = `./dashboard.html?id=${novelId}`;

      let chapters = [];
      let activeChapterId = null;
      let saveTimeout = null;
      let isSavingInFlight = false;
      let searchMatches = [];
      let currentMatchIndex = -1;

      // Global reference for selection-aware AI prompts
      window.novalistaSelection = "";

      // Continuous selection tracking on the writing canvas
      function updateSelectionCache() {
        const textarea = elements.chapterBody;
        if (!textarea) return;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        if (typeof start === "number" && typeof end === "number" && start !== end) {
          const selected = textarea.value.substring(start, end).trim();
          if (selected) {
            window.novalistaSelection = selected;
          }
        }
      }

      elements.chapterBody.addEventListener("mouseup", updateSelectionCache);
      elements.chapterBody.addEventListener("keyup", updateSelectionCache);
      elements.chapterBody.addEventListener("select", updateSelectionCache);

      // Render chapters in sidebar
      function renderChapters() {
        elements.chaptersList.innerHTML = "";
        chapters.forEach((ch, idx) => {
          const li = document.createElement("li");
          li.className = `chapter-item ${ch.id === activeChapterId ? "active" : ""}`;
          li.textContent = `${idx + 1}. ${ch.title || "Untitled"}`;
          li.onclick = () => selectChapter(ch.id);
          elements.chaptersList.appendChild(li);
        });
      }

      // Update word & character stats
      function updateStats(text) {
        const trimmed = (text || "").trim();
        const words = trimmed ? trimmed.split(/\s+/).filter(Boolean).length : 0;
        const chars = (text || "").length;

        elements.statusWordCount.textContent = `${words.toLocaleString()} words`;
        elements.statusCharCount.textContent = `${chars.toLocaleString()} characters`;
      }

      // Save status indicator states
      function setSaveStatus(state) {
        if (state === "saving") {
          elements.saveIndicator.textContent = "Saving...";
          elements.saveIndicator.style.color = "var(--accent-warning)";
        } else if (state === "saved") {
          elements.saveIndicator.textContent = "All changes saved";
          elements.saveIndicator.style.color = "var(--accent-success)";
          elements.statusLastSaved.textContent = `Saved at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        } else if (state === "offline") {
          elements.saveIndicator.textContent = "Offline — Saved locally";
          elements.saveIndicator.style.color = "var(--accent-warning)";
        } else if (state === "error") {
          elements.saveIndicator.textContent = "Sync Error (Retrying...)";
          elements.saveIndicator.style.color = "var(--accent-danger)";
        }
      }

      function getLocalDraftKey(chapterId) {
        return `draft_${novelId}_${chapterId}`;
      }

      // Instant local persistence fail-safe
      function writeLocalDraft(chapterId, title, body) {
        if (!chapterId) return;
        try {
          localStorage.setItem(getLocalDraftKey(chapterId), JSON.stringify({
            title,
            body,
            savedAt: Date.now()
          }));
        } catch (_) {}
      }

      function clearLocalDraft(chapterId) {
        if (!chapterId) return;
        localStorage.removeItem(getLocalDraftKey(chapterId));
      }

      // Switch active chapter
      async function selectChapter(id) {
        if (saveTimeout) {
          clearTimeout(saveTimeout);
          await saveCurrentChapterImmediate();
        }

        activeChapterId = id;
        const activeChapter = chapters.find((c) => c.id === id);

        if (activeChapter) {
          elements.chapterTitleInput.disabled = false;
          elements.chapterBody.disabled = false;

          // Check if there is an un-synced local draft newer than server version
          const draftRaw = localStorage.getItem(getLocalDraftKey(id));
          if (draftRaw) {
            try {
              const draft = JSON.parse(draftRaw);
              if (draft.body && draft.body !== activeChapter.body) {
                activeChapter.body = draft.body;
                activeChapter.title = draft.title || activeChapter.title;
              }
            } catch (_) {}
          }

          elements.chapterTitleInput.value = activeChapter.title || "";
          elements.chapterBody.value = activeChapter.body || "";
          updateStats(activeChapter.body || "");
          setSaveStatus("saved");
        } else {
          elements.chapterTitleInput.disabled = true;
          elements.chapterBody.disabled = true;
          elements.chapterTitleInput.value = "";
          elements.chapterBody.value = "";
          updateStats("");
        }

        renderChapters();
      }

      // Load all chapters
      async function loadChapters() {
        try {
          const res = await ApiClient.get(`/api/content?novelId=${novelId}&type=chapters`);
          chapters = res.items || [];

          if (chapters.length === 0) {
            await createNewChapter("Chapter 1");
          } else {
            selectChapter(chapters[0].id);
          }
        } catch (err) {
          console.error("Failed to load chapters:", err);
          setSaveStatus("error");
        }
      }

      // Create new chapter
      async function createNewChapter(defaultTitle) {
        const title = defaultTitle || `Chapter ${chapters.length + 1}`;
        const newChapter = {
          title,
          body: "",
          order: chapters.length,
        };

        try {
          const res = await ApiClient.post("/api/content", {
            novelId,
            type: "chapters",
            item: newChapter,
          });

          chapters.push(res.item);
          selectChapter(res.item.id);
        } catch (err) {
          alert("Error creating chapter: " + err.message);
        }
      }

      // Save chapter payload to Cloudflare KV
      async function saveCurrentChapterImmediate() {
        if (!activeChapterId || isSavingInFlight) return;
        const chapter = chapters.find((c) => c.id === activeChapterId);
        if (!chapter) return;

        isSavingInFlight = true;
        setSaveStatus("saving");

        try {
          await ApiClient.put("/api/content", {
            novelId,
            type: "chapters",
            item: chapter,
          });
          clearLocalDraft(activeChapterId);
          setSaveStatus("saved");
        } catch (err) {
          console.warn("Autosave network error, retained in local storage:", err.message);
          setSaveStatus("offline");
        } finally {
          isSavingInFlight = false;
        }
      }

      // Debounced auto-save handler (1.5 seconds)
      function triggerAutoSave() {
        if (!activeChapterId) return;
        const chapter = chapters.find((c) => c.id === activeChapterId);
        if (!chapter) return;

        chapter.title = elements.chapterTitleInput.value;
        chapter.body = elements.chapterBody.value;
        updateStats(chapter.body);

        // Immediate client-side fallback
        writeLocalDraft(activeChapterId, chapter.title, chapter.body);

        // Update list title dynamically
        const activeListItem = elements.chaptersList.querySelector(`.chapter-item.active`);
        if (activeListItem) {
          const idx = chapters.findIndex((c) => c.id === activeChapterId);
          activeListItem.textContent = `${idx + 1}. ${chapter.title || "Untitled"}`;
        }

        setSaveStatus("saving");
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveCurrentChapterImmediate, 1500);
      }

      // Delete active chapter
      async function deleteActiveChapter() {
        if (!activeChapterId) return;
        if (chapters.length <= 1) {
          alert("A novel must contain at least one chapter.");
          return;
        }

        const confirmed = confirm("Are you sure you want to delete this chapter?");
        if (!confirmed) return;

        const idToDelete = activeChapterId;
        try {
          await ApiClient.delete(`/api/content?novelId=${novelId}&type=chapters&itemId=${idToDelete}`);
          clearLocalDraft(idToDelete);
          chapters = chapters.filter((c) => c.id !== idToDelete);
          selectChapter(chapters[0].id);
        } catch (err) {
          alert("Failed to delete chapter: " + err.message);
        }
      }

      // Find tool
      function toggleFind(show) {
        const isVisible = elements.findBar.classList.contains("active");
        const targetState = show !== undefined ? show : !isVisible;

        if (targetState) {
          elements.findBar.classList.add("active");
          elements.findInput.focus();
          elements.findInput.select();
          performSearch();
        } else {
          elements.findBar.classList.remove("active");
          searchMatches = [];
          currentMatchIndex = -1;
          elements.findMatchCount.textContent = "0/0";
        }
      }

      function performSearch() {
        const term = elements.findInput.value;
        const content = elements.chapterBody.value;
        searchMatches = [];
        currentMatchIndex = -1;

        if (!term || !content) {
          elements.findMatchCount.textContent = "0/0";
          return;
        }

        let pos = 0;
        const lowerContent = content.toLowerCase();
        const lowerTerm = term.toLowerCase();

        while ((pos = lowerContent.indexOf(lowerTerm, pos)) !== -1) {
          searchMatches.push(pos);
          pos += lowerTerm.length;
        }

        if (searchMatches.length > 0) {
          currentMatchIndex = 0;
          jumpToMatch();
        } else {
          elements.findMatchCount.textContent = "0/0";
        }
      }

      function jumpToMatch() {
        if (searchMatches.length === 0 || currentMatchIndex < 0) return;

        elements.findMatchCount.textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;
        const startPos = searchMatches[currentMatchIndex];
        const endPos = startPos + elements.findInput.value.length;

        elements.chapterBody.focus();
        elements.chapterBody.setSelectionRange(startPos, endPos);
        updateSelectionCache();
      }

      // Keyboard shortcut Ctrl+F / Cmd+F inside editor
      window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
          e.preventDefault();
          toggleFind(true);
        }
        if (e.key === "Escape" && elements.findBar.classList.contains("active")) {
          toggleFind(false);
        }
      });

      // Event listeners
      elements.chapterTitleInput.addEventListener("input", triggerAutoSave);
      elements.chapterBody.addEventListener("input", triggerAutoSave);
      elements.addChapterBtn.addEventListener("click", () => createNewChapter());
      elements.deleteChapterBtn.addEventListener("click", deleteActiveChapter);

      elements.toggleFindBtn.addEventListener("click", () => toggleFind());
      elements.closeFindBtn.addEventListener("click", () => toggleFind(false));
      elements.findInput.addEventListener("input", performSearch);
      elements.findNextBtn.addEventListener("click", () => {
        if (searchMatches.length > 0) {
          currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
          jumpToMatch();
        }
      });
      elements.findPrevBtn.addEventListener("click", () => {
        if (searchMatches.length > 0) {
          currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
          jumpToMatch();
        }
      });

      // Flushes unsaved modifications immediately if the window or tab is closed
      window.addEventListener("beforeunload", () => {
        if (saveTimeout) {
          clearTimeout(saveTimeout);
          if (activeChapterId) {
            const ch = chapters.find((c) => c.id === activeChapterId);
            if (ch) {
              writeLocalDraft(activeChapterId, ch.title, ch.body);
            }
          }
        }
      });

      document.addEventListener("DOMContentLoaded", loadChapters);
    })();
  </script>
</body>
</html>
