<!-- timeline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Tool - Novel Assistant</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      overflow-x: hidden;
    }

    /* Mobile Landscape Enforcer Overlay */
    #landscapeBlocker {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--bg-primary);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .rotate-device-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: rotateHint 2s infinite ease-in-out;
    }

    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    /* Detect mobile portrait orientation */
    @media (max-width: 900px) and (orientation: portrait) {
      #landscapeBlocker {
        display: flex;
      }
      #timelineAppContainer {
        display: none;
      }
    }

    /* Timeline Workspace */
    .timeline-page-container {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .timeline-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .timeline-canvas-wrapper {
      position: relative;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 4rem 2rem;
      overflow-x: auto;
      min-height: 480px;
    }

    .timeline-track-line {
      position: absolute;
      top: 50%;
      left: 60px;
      right: 60px;
      height: 4px;
      background-color: var(--border-color);
      transform: translateY(-50%);
    }

    .timeline-events-container {
      position: relative;
      min-width: 900px;
      height: 380px;
    }

    .timeline-node {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 180px;
      transition: transform 0.2s ease;
    }
    .timeline-node:hover {
      transform: translateX(-50%) scale(1.05);
      z-index: 25;
    }

    .timeline-pin {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--accent-primary);
      border: 3px solid var(--bg-secondary);
      box-shadow: 0 0 0 2px var(--accent-primary);
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }

    .timeline-node.top {
      top: 20px;
      height: 170px;
      justify-content: flex-start;
    }
    .timeline-node.top .timeline-pin {
      bottom: -9px;
      top: auto;
      transform: none;
    }

    .timeline-node.bottom {
      bottom: 20px;
      height: 170px;
      justify-content: flex-end;
    }
    .timeline-node.bottom .timeline-pin {
      top: -9px;
      transform: none;
    }

    .node-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.65rem;
      width: 100%;
      box-shadow: var(--shadow);
      font-size: 0.8rem;
    }

    .node-card-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-card-period {
      font-size: 0.725rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .level-badge {
      display: inline-block;
      font-size: 0.675rem;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .level-main {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--accent-danger);
    }
    .level-side {
      background-color: rgba(59, 130, 246, 0.2);
      color: var(--accent-primary);
    }
    .level-filler {
      background-color: rgba(148, 163, 184, 0.2);
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Mandatory Mobile Landscape Blocker -->
  <div id="landscapeBlocker">
    <div class="rotate-device-icon">🔄</div>
    <h2>Please Rotate Your Device</h2>
    <p style="color: var(--text-muted); margin-top: 0.5rem; max-width: 320px;">
      The timeline canvas requires landscape orientation on mobile phones for optimal horizontal plotting.
    </p>
  </div>

  <div id="timelineAppContainer">
    <header class="navbar">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a id="navBackDashboard" href="#" class="btn btn-secondary btn-sm">← Dashboard</a>
        <span style="font-weight: 700;">Story Timeline</span>
      </div>
      <div class="navbar-actions">
        <button id="openAddEventBtn" class="btn btn-primary btn-sm">+ Add Event</button>
      </div>
    </header>

    <main class="timeline-page-container">
      <div class="timeline-toolbar">
        <div>
          <h2 style="font-size: 1.15rem;">Chronological Event Track</h2>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Plot narrative arcs, side quests, and character beats chronologically.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <label style="font-size: 0.8rem; color: var(--text-muted);">Canvas Width:</label>
          <input type="range" id="timelineZoomRange" min="900" max="3200" step="100" value="1200" style="width: 140px;">
        </div>
      </div>

      <div class="timeline-canvas-wrapper">
        <div id="timelineEventsContainer" class="timeline-events-container">
          <div class="timeline-track-line"></div>
          <!-- Event Nodes placed dynamically -->
        </div>
      </div>
    </main>
  </div>

  <!-- Event Modal (Create / Edit) -->
  <div id="eventModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 580px; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 id="eventModalTitle">Add Timeline Event</h3>
        <button id="closeEventModalBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>
      <form id="eventForm">
        <input type="hidden" id="eventIdInput">

        <div class="form-group">
          <label for="eventTitleInput">Event Title *</label>
          <input type="text" id="eventTitleInput" required placeholder="e.g., The Siege of the Western Gate">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="eventTimePeriodInput">Time / Story Period *</label>
            <input type="text" id="eventTimePeriodInput" required placeholder="e.g., Day 4, Dawn / Act II">
          </div>
          <div class="form-group">
            <label for="eventLevelInput">Event Level</label>
            <select id="eventLevelInput">
              <option value="Main event">Main Event (Crucial Arc)</option>
              <option value="Side event">Side Event (Subplot / Twist)</option>
              <option value="Filler">Filler / Pacing Beat</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="eventPovInput">POV Character</label>
            <input type="text" id="eventPovInput" placeholder="Character perspective">
          </div>
          <div class="form-group">
            <label for="eventLocationInput">Location / Setting</label>
            <input type="text" id="eventLocationInput" placeholder="Scene location">
          </div>
        </div>

        <div class="form-group">
          <label for="eventConsequenceInput">Impact / Consequence</label>
          <textarea id="eventConsequenceInput" rows="2" placeholder="How does this event shift stakes or alter character decisions?"></textarea>
        </div>

        <div class="form-group">
          <label for="eventPosRange">Timeline Position (% along track)</label>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="range" id="eventPosRange" min="2" max="98" value="50">
            <span id="eventPosLabel" style="font-size: 0.85rem; font-weight: 600; min-width: 45px;">50%</span>
          </div>
        </div>

        <div id="eventFormError" class="form-error"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
          <button type="button" id="deleteEventBtn" class="btn btn-danger" style="display: none;">Delete</button>
          <div style="display: flex; gap: 0.5rem; margin-left: auto;">
            <button type="button" id="cancelEventModalBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="saveEventBtn" class="btn btn-primary">Save Event</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="./api-client.js"></script>
  <script src="./chatbot.js"></script>
  <script>
    // State and visual rendering for Timeline Tool
    (function () {
      const novelId = ApiClient.getNovelId();
      if (!novelId) {
        window.location.href = "./index.html";
        return;
      }

      // DOM Elements
      const navBackDashboard = document.getElementById("navBackDashboard");
      const timelineEventsContainer = document.getElementById("timelineEventsContainer");
      const timelineZoomRange = document.getElementById("timelineZoomRange");
      const openAddEventBtn = document.getElementById("openAddEventBtn");
      const eventModal = document.getElementById("eventModal");
      const eventModalTitle = document.getElementById("eventModalTitle");
      const closeEventModalBtn = document.getElementById("closeEventModalBtn");
      const cancelEventModalBtn = document.getElementById("cancelEventModalBtn");
      const deleteEventBtn = document.getElementById("deleteEventBtn");
      const eventForm = document.getElementById("eventForm");
      const eventIdInput = document.getElementById("eventIdInput");
      const eventTitleInput = document.getElementById("eventTitleInput");
      const eventTimePeriodInput = document.getElementById("eventTimePeriodInput");
      const eventLevelInput = document.getElementById("eventLevelInput");
      const eventPovInput = document.getElementById("eventPovInput");
      const eventLocationInput = document.getElementById("eventLocationInput");
      const eventConsequenceInput = document.getElementById("eventConsequenceInput");
      const eventPosRange = document.getElementById("eventPosRange");
      const eventPosLabel = document.getElementById("eventPosLabel");
      const eventFormError = document.getElementById("eventFormError");
      const saveEventBtn = document.getElementById("saveEventBtn");

      navBackDashboard.href = `./dashboard.html?id=${novelId}`;

      let timelineEvents = [];

      // Helper: Escape HTML strings
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text || "";
        return div.innerHTML;
      }

      // Handle Dynamic Track Canvas Width Zoom
      timelineZoomRange.addEventListener("input", (e) => {
        timelineEventsContainer.style.minWidth = `${e.target.value}px`;
      });

      // Slider label sync
      eventPosRange.addEventListener("input", (e) => {
        eventPosLabel.textContent = `${e.target.value}%`;
      });

      // Load events from KV
      async function loadEvents() {
        try {
          const data = await ApiClient.get(`/api/content?novelId=${novelId}&type=timeline`);
          timelineEvents = data.items || [];
          renderTimeline();
        } catch (err) {
          alert("Failed to load timeline events: " + err.message);
        }
      }

      // Render nodes along timeline track
      function renderTimeline() {
        // Retain central track line
        timelineEventsContainer.innerHTML = '<div class="timeline-track-line"></div>';

        // Sort chronologically by position percent
        timelineEvents.sort((a, b) => (a.positionPercent || 50) - (b.positionPercent || 50));

        timelineEvents.forEach((ev, idx) => {
          const isTop = idx % 2 === 0;
          const node = document.createElement("div");
          node.className = `timeline-node ${isTop ? "top" : "bottom"}`;
          node.style.left = `${ev.positionPercent || 50}%`;

          let levelClass = "level-main";
          if (ev.eventLevel === "Side event") levelClass = "level-side";
          if (ev.eventLevel === "Filler") levelClass = "level-filler";

          node.innerHTML = `
            <div class="node-card">
              <div class="node-card-title">${escapeHtml(ev.title)}</div>
              <div class="node-card-period">${escapeHtml(ev.timePeriod)}</div>
              <span class="level-badge ${levelClass}">${escapeHtml(ev.eventLevel || "Main event")}</span>
              ${ev.povCharacter ? `<div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">POV: ${escapeHtml(ev.povCharacter)}</div>` : ""}
            </div>
            <div class="timeline-pin"></div>
          `;

          node.onclick = () => openEditModal(ev);
          timelineEventsContainer.appendChild(node);
        });
      }

      // Modal open/close controls
      function openAddModal() {
        eventForm.reset();
        eventIdInput.value = "";
        eventPosRange.value = 50;
        eventPosLabel.textContent = "50%";
        eventModalTitle.textContent = "Add Timeline Event";
        deleteEventBtn.style.display = "none";
        eventFormError.style.display = "none";
        eventModal.classList.add("active");
      }

      function openEditModal(ev) {
        eventIdInput.value = ev.id;
        eventTitleInput.value = ev.title || "";
        eventTimePeriodInput.value = ev.timePeriod || "";
        eventLevelInput.value = ev.eventLevel || "Main event";
        eventPovInput.value = ev.povCharacter || "";
        eventLocationInput.value = ev.location || "";
        eventConsequenceInput.value = ev.consequence || "";
        eventPosRange.value = ev.positionPercent || 50;
        eventPosLabel.textContent = `${ev.positionPercent || 50}%`;

        eventModalTitle.textContent = "Edit Timeline Event";
        deleteEventBtn.style.display = "inline-block";
        eventFormError.style.display = "none";
        eventModal.classList.add("active");
      }

      function closeModal() {
        eventModal.classList.remove("active");
      }

      openAddEventBtn.addEventListener("click", openAddModal);
      closeEventModalBtn.addEventListener("click", closeModal);
      cancelEventModalBtn.addEventListener("click", closeModal);

      // Form submission (Add / Update)
      eventForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        eventFormError.style.display = "none";

        const title = eventTitleInput.value.trim();
        const timePeriod = eventTimePeriodInput.value.trim();

        if (!title || !timePeriod) {
          eventFormError.textContent = "Title and Time/Period are mandatory.";
          eventFormError.style.display = "block";
          return;
        }

        const eventPayload = {
          title,
          timePeriod,
          eventLevel: eventLevelInput.value,
          povCharacter: eventPovInput.value.trim(),
          location: eventLocationInput.value.trim(),
          consequence: eventConsequenceInput.value.trim(),
          positionPercent: Number(eventPosRange.value),
        };

        saveEventBtn.disabled = true;
        saveEventBtn.textContent = "Saving...";

        try {
          const isEditing = Boolean(eventIdInput.value);

          if (isEditing) {
            eventPayload.id = eventIdInput.value;
            await ApiClient.put("/api/content", {
              novelId,
              type: "timeline",
              item: eventPayload,
            });

            const index = timelineEvents.findIndex((item) => item.id === eventPayload.id);
            if (index !== -1) timelineEvents[index] = { ...timelineEvents[index], ...eventPayload };
          } else {
            const res = await ApiClient.post("/api/content", {
              novelId,
              type: "timeline",
              item: eventPayload,
            });
            timelineEvents.push(res.item);
          }

          closeModal();
          renderTimeline();
        } catch (err) {
          eventFormError.textContent = err.message;
          eventFormError.style.display = "block";
        } finally {
          saveEventBtn.disabled = false;
          saveEventBtn.textContent = "Save Event";
        }
      });

      // Delete event
      deleteEventBtn.addEventListener("click", async () => {
        const eventId = eventIdInput.value;
        if (!eventId) return;

        const confirmed = confirm("Are you sure you want to delete this timeline event?");
        if (!confirmed) return;

        try {
          await ApiClient.delete(`/api/content?novelId=${novelId}&type=timeline&itemId=${eventId}`);
          timelineEvents = timelineEvents.filter((item) => item.id !== eventId);
          closeModal();
          renderTimeline();
        } catch (err) {
          alert("Failed to delete event: " + err.message);
        }
      });

      document.addEventListener("DOMContentLoaded", loadEvents);
    })();
  </script>
</body>
</html>
