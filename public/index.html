<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Writer Assistant - Hub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }
    .novel-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
    }
    .novel-cover {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
    }
    .novel-cover-placeholder {
      width: 100%;
      height: 180px;
      background-color: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      border: 1px dashed var(--border-color);
    }
    .novel-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .novel-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .novel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .auth-container {
      max-width: 420px;
      margin: 4rem auto;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .auth-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .auth-tab.active {
      color: var(--accent-primary);
      border-bottom: 2px solid var(--accent-primary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .form-error {
      color: var(--accent-danger);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    #coverPreview {
      max-height: 120px;
      object-fit: contain;
      margin-top: 0.5rem;
      display: none;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="/index.html" class="navbar-brand">
      <span>📖 Novel Writer Assistant</span>
    </a>
    <div class="navbar-actions" id="navActions">
      <span id="userGreeting" style="font-size: 0.875rem; color: var(--text-muted);"></span>
      <button id="logoutBtn" class="btn btn-secondary btn-sm" style="display: none;">Log Out</button>
    </div>
  </header>

  <main class="container">
    <!-- Auth Section (Hidden when logged in) -->
    <div id="authSection" class="auth-container">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">Log In</button>
        <button id="tabRegister" class="auth-tab" type="button">Register</button>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" required autocomplete="username" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="At least 6 characters">
        </div>
        <div id="authError" class="form-error"></div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
      </form>
    </div>

    <!-- Hub Section (Shown when logged in) -->
    <div id="hubSection" style="display: none;">
      <div class="hub-header">
        <div>
          <h2>Your Novels</h2>
          <p style="color: var(--text-muted); font-size: 0.875rem;">Select a novel to enter its toolbox dashboard.</p>
        </div>
        <button id="openCreateModalBtn" class="btn btn-primary">+ Create New Novel</button>
      </div>

      <div id="novelsGrid" class="grid grid-cols-3">
        <!-- Novel cards will be populated here -->
      </div>

      <div id="emptyNovels" class="empty-state" style="display: none;">
        <h3>No novels found</h3>
        <p style="margin-top: 0.5rem;">Click "+ Create New Novel" above to start your first story.</p>
      </div>
    </div>
  </main>

  <!-- Create Novel Modal -->
  <div id="createModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3>Create New Novel</h3>
        <button id="closeCreateModalBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>
      <form id="createNovelForm">
        <div class="form-group">
          <label for="novelTitleInput">Title *</label>
          <input type="text" id="novelTitleInput" required placeholder="Novel title (mandatory)">
        </div>
        <div class="form-group">
          <label for="novelDescInput">Description (Optional)</label>
          <textarea id="novelDescInput" rows="3" placeholder="Brief premise or notes"></textarea>
        </div>
        <div class="form-group">
          <label for="novelCoverInput">Cover Image (Optional, max 5 MB)</label>
          <input type="file" id="novelCoverInput" accept="image/*">
          <img id="coverPreview" alt="Cover Preview">
        </div>
        <div id="createNovelError" class="form-error"></div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" id="cancelCreateBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveNovelBtn" class="btn btn-primary">Create Novel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/hub.js"></script>
</body>
</html>
