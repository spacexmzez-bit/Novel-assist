<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Characters Roster - Novel Assistant</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .roster-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .roster-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .search-input-inline {
      max-width: 240px;
    }
    .character-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      border-top: 4px solid var(--accent-primary);
    }
    .char-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .char-role {
      font-size: 0.8rem;
      color: var(--accent-primary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }
    .char-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .char-detail-row {
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
      display: flex;
      gap: 0.4rem;
    }
    .char-detail-label {
      color: var(--text-muted);
      font-weight: 600;
      min-width: 95px;
    }
    .char-traits-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.75rem;
      margin-bottom: 1rem;
    }
    .trait-chip {
      background-color: var(--bg-tertiary);
      color: var(--text-main);
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
    }
    .char-card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a id="navBackDashboard" href="#" class="btn btn-secondary btn-sm">← Dashboard</a>
      <span style="font-weight: 700;">Characters Roster</span>
    </div>
    <div class="navbar-actions">
      <button id="openCharModalBtn" class="btn btn-primary btn-sm">+ Add Character</button>
    </div>
  </header>

  <main class="container">
    <div class="roster-header">
      <div>
        <h2>Story Cast & Profiles</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Manage cast members, roles, motivations, alignments, and narrative appearances.</p>
      </div>
      <div class="roster-controls">
        <input type="text" id="charSearchInput" class="search-input-inline" placeholder="Search by name or trait...">
        <select id="roleFilterSelect" style="width: 150px;">
          <option value="ALL">All Roles</option>
          <option value="Protagonist">Protagonist</option>
          <option value="Antagonist">Antagonist</option>
          <option value="Deuteragonist">Deuteragonist</option>
          <option value="Supporting">Supporting</option>
          <option value="Minor">Minor</option>
        </select>
      </div>
    </div>

    <div id="charactersGrid" class="grid grid-cols-3">
      <!-- Character cards rendered dynamically -->
    </div>

    <div id="emptyCharacters" class="empty-state" style="display: none;">
      <h3>No characters added yet</h3>
      <p style="margin-top: 0.5rem;">Click "+ Add Character" to populate your story's cast.</p>
    </div>
  </main>

  <!-- Character Creation / Edit Modal -->
  <div id="charModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 620px; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 id="charModalTitle">Add Character</h3>
        <button id="closeCharModalBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>
      <form id="charForm">
        <input type="hidden" id="charIdInput">
        
        <div class="form-group">
          <label for="charNameInput">Name *</label>
          <input type="text" id="charNameInput" required placeholder="Full or primary name">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="charRoleInput">Main Role *</label>
            <select id="charRoleInput" required>
              <option value="Protagonist">Protagonist</option>
              <option value="Antagonist">Antagonist</option>
              <option value="Deuteragonist">Deuteragonist</option>
              <option value="Supporting">Supporting</option>
              <option value="Minor">Minor</option>
            </select>
          </div>
          <div class="form-group">
            <label for="charStatusInput">Status</label>
            <select id="charStatusInput">
              <option value="Alive">Alive</option>
              <option value="Deceased">Deceased</option>
              <option value="Missing">Missing</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="charDescInput">Description *</label>
          <textarea id="charDescInput" rows="3" required placeholder="Physical appearance, voice, attitude, or background"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="charArchetypeInput">Archetype / Alignment</label>
            <input type="text" id="charArchetypeInput" placeholder="e.g., Reluctant Mentor, Chaotic Neutral">
          </div>
          <div class="form-group">
            <label for="charAppearanceInput">First Story Appearance</label>
            <input type="text" id="charAppearanceInput" placeholder="e.g., Chapter 1, Scene 3 tavern">
          </div>
        </div>

        <div class="form-group">
          <label for="charMotivationInput">Core Motivation & Goal</label>
          <input type="text" id="charMotivationInput" placeholder="What do they desperately want or fear?">
        </div>

        <div class="form-group">
          <label for="charRelationshipsInput">Key Relationships</label>
          <input type="text" id="charRelationshipsInput" placeholder="e.g., Sister of Jon, sworn rival of Vane">
        </div>

        <div class="form-group">
          <label for="charTraitsInput">Traits (Comma-separated)</label>
          <input type="text" id="charTraitsInput" placeholder="Cynical, razor-sharp, loyal, observant">
        </div>

        <div id="charFormError" class="form-error"></div>

        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" id="cancelCharModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveCharBtn" class="btn btn-primary">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api-client.js"></script>
  <script src="/js/chatbot.js"></script>
  <script src="/js/characters.js"></script>
</body>
</html>
