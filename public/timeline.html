<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Tool - Novel Assistant</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      overflow-x: hidden;
    }

    /* Mobile Landscape Enforcer Overlay */
    #landscapeBlocker {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--bg-primary);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .rotate-device-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: rotateHint 2s infinite ease-in-out;
    }

    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    /* Detect mobile portrait orientation */
    @media (max-width: 900px) and (orientation: portrait) {
      #landscapeBlocker {
        display: flex;
      }
      #timelineAppContainer {
        display: none;
      }
    }

    /* Timeline Workspace */
    .timeline-page-container {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .timeline-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .timeline-canvas-wrapper {
      position: relative;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 4rem 2rem;
      overflow-x: auto;
      min-height: 480px;
    }

    .timeline-track-line {
      position: absolute;
      top: 50%;
      left: 60px;
      right: 60px;
      height: 4px;
      background-color: var(--border-color);
      transform: translateY(-50%);
    }

    .timeline-events-container {
      position: relative;
      min-width: 900px;
      height: 380px;
    }

    .timeline-node {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 180px;
      transition: transform 0.2s ease;
    }
    .timeline-node:hover {
      transform: translateX(-50%) scale(1.05);
      z-index: 25;
    }

    .timeline-pin {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--accent-primary);
      border: 3px solid var(--bg-secondary);
      box-shadow: 0 0 0 2px var(--accent-primary);
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }

    .timeline-node.top {
      top: 20px;
      height: 170px;
      justify-content: flex-start;
    }
    .timeline-node.top .timeline-pin {
      bottom: -9px;
      top: auto;
      transform: none;
    }

    .timeline-node.bottom {
      bottom: 20px;
      height: 170px;
      justify-content: flex-end;
    }
    .timeline-node.bottom .timeline-pin {
      top: -9px;
      transform: none;
    }

    .node-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.65rem;
      width: 100%;
      box-shadow: var(--shadow);
      font-size: 0.8rem;
    }

    .node-card-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-card-period {
      font-size: 0.725rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .level-badge {
      display: inline-block;
      font-size: 0.675rem;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .level-main {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--accent-danger);
    }
    .level-side {
      background-color: rgba(59, 130, 246, 0.2);
      color: var(--accent-primary);
    }
    .level-filler {
      background-color: rgba(148, 163, 184, 0.2);
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Mandatory Mobile Landscape Blocker -->
  <div id="landscapeBlocker">
    <div class="rotate-device-icon">🔄</div>
    <h2>Please Rotate Your Device</h2>
    <p style="color: var(--text-muted); margin-top: 0.5rem; max-width: 320px;">
      The timeline canvas requires landscape orientation on mobile phones for optimal horizontal plotting.
    </p>
  </div>

  <div id="timelineAppContainer">
    <header class="navbar">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a id="navBackDashboard" href="#" class="btn btn-secondary btn-sm">← Dashboard</a>
        <span style="font-weight: 700;">Story Timeline</span>
      </div>
      <div class="navbar-actions">
        <button id="openAddEventBtn" class="btn btn-primary btn-sm">+ Add Event</button>
      </div>
    </header>

    <main class="timeline-page-container">
      <div class="timeline-toolbar">
        <div>
          <h2 style="font-size: 1.15rem;">Chronological Event Track</h2>
          <p style="color: var(--text-muted); font-size: 0.8rem;">Plot narrative arcs, side quests, and character beats chronologically.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <label style="font-size: 0.8rem; color: var(--text-muted);">Canvas Width:</label>
          <input type="range" id="timelineZoomRange" min="900" max="3200" step="100" value="1200" style="width: 140px;">
        </div>
      </div>

      <div class="timeline-canvas-wrapper">
        <div id="timelineEventsContainer" class="timeline-events-container">
          <div class="timeline-track-line"></div>
          <!-- Event Nodes placed dynamically -->
        </div>
      </div>
    </main>
  </div>

  <!-- Event Modal (Create / Edit) -->
  <div id="eventModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 580px; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 id="eventModalTitle">Add Timeline Event</h3>
        <button id="closeEventModalBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>
      <form id="eventForm">
        <input type="hidden" id="eventIdInput">

        <div class="form-group">
          <label for="eventTitleInput">Event Title *</label>
          <input type="text" id="eventTitleInput" required placeholder="e.g., The Siege of the Western Gate">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="eventTimePeriodInput">Time / Story Period *</label>
            <input type="text" id="eventTimePeriodInput" required placeholder="e.g., Day 4, Dawn / Act II">
          </div>
          <div class="form-group">
            <label for="eventLevelInput">Event Level</label>
            <select id="eventLevelInput">
              <option value="Main event">Main Event (Crucial Arc)</option>
              <option value="Side event">Side Event (Subplot / Twist)</option>
              <option value="Filler">Filler / Pacing Beat</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="eventPovInput">POV Character</label>
            <input type="text" id="eventPovInput" placeholder="Character perspective">
          </div>
          <div class="form-group">
            <label for="eventLocationInput">Location / Setting</label>
            <input type="text" id="eventLocationInput" placeholder="Scene location">
          </div>
        </div>

        <div class="form-group">
          <label for="eventConsequenceInput">Impact / Consequence</label>
          <textarea id="eventConsequenceInput" rows="2" placeholder="How does this event shift stakes or alter character decisions?"></textarea>
        </div>

        <div class="form-group">
          <label for="eventPosRange">Timeline Position (% along track)</label>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="range" id="eventPosRange" min="2" max="98" value="50">
            <span id="eventPosLabel" style="font-size: 0.85rem; font-weight: 600; min-width: 45px;">50%</span>
          </div>
        </div>

        <div id="eventFormError" class="form-error"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
          <button type="button" id="deleteEventBtn" class="btn btn-danger" style="display: none;">Delete</button>
          <div style="display: flex; gap: 0.5rem; margin-left: auto;">
            <button type="button" id="cancelEventModalBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="saveEventBtn" class="btn btn-primary">Save Event</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api-client.js"></script>
  <script src="/js/chatbot.js"></script>
  <script src="/js/timeline.js"></script>
</body>
</html>
