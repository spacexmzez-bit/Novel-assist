<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Body - Editor</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      overflow: hidden;
      height: 100vh;
    }
    .editor-layout {
      display: flex;
      height: calc(100vh - 61px);
      position: relative;
    }
    /* Sidebar: Chapter List */
    .chapters-sidebar {
      width: 280px;
      min-width: 250px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chapters-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chapters-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0.5rem;
    }
    .chapter-item {
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
      transition: background 0.15s ease;
    }
    .chapter-item:hover {
      background-color: var(--bg-tertiary);
    }
    .chapter-item.active {
      background-color: var(--accent-primary);
      color: #ffffff;
      font-weight: 600;
    }
    /* Main Writing Area */
    .editor-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      position: relative;
    }
    .editor-toolbar {
      padding: 0.75rem 1.5rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .chapter-title-input {
      background: transparent;
      border: 1px solid transparent;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      max-width: 400px;
    }
    .chapter-title-input:focus {
      background-color: var(--bg-primary);
      border-color: var(--border-color);
    }
    .editor-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .editor-textarea-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      overflow-y: auto;
      padding: 2rem 1rem;
    }
    .editor-textarea {
      width: 100%;
      max-width: 800px;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 1.05rem;
      line-height: 1.8;
      resize: none;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .editor-statusbar {
      padding: 0.4rem 1.5rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    /* Find / Search Overlay */
    .find-bar {
      position: absolute;
      top: 55px;
      right: 2rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 0.6rem 0.85rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 30;
    }
    .find-bar.active {
      display: flex;
    }
    .find-input {
      width: 200px;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }
    .find-match-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 45px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a id="navBackDashboard" href="#" class="btn btn-secondary btn-sm">← Dashboard</a>
      <span style="font-weight: 700;">Novel Body</span>
    </div>
    <div class="navbar-actions">
      <button id="toggleFindBtn" class="btn btn-secondary btn-sm" title="Search text (Ctrl+F)">🔍 Find</button>
      <button id="deleteChapterBtn" class="btn btn-danger btn-sm" title="Delete Active Chapter">Delete Chapter</button>
    </div>
  </header>

  <div class="editor-layout">
    <!-- Chapter Switcher Sidebar -->
    <aside class="chapters-sidebar">
      <div class="chapters-header">
        <span style="font-weight: 600; font-size: 0.9rem;">Chapters</span>
        <button id="addChapterBtn" class="btn btn-primary btn-sm">+ New</button>
      </div>
      <ul id="chaptersList" class="chapters-list">
        <!-- Chapters populated dynamically -->
      </ul>
    </aside>

    <!-- Main Text Editor -->
    <main class="editor-main">
      <!-- Find Bar Tool -->
      <div id="findBar" class="find-bar">
        <input type="text" id="findInput" class="find-input" placeholder="Find in chapter...">
        <span id="findMatchCount" class="find-match-count">0/0</span>
        <button id="findPrevBtn" class="btn btn-secondary btn-sm" type="button" title="Previous match">▲</button>
        <button id="findNextBtn" class="btn btn-secondary btn-sm" type="button" title="Next match">▼</button>
        <button id="closeFindBtn" class="btn btn-secondary btn-sm" type="button">✕</button>
      </div>

      <div class="editor-toolbar">
        <input type="text" id="chapterTitleInput" class="chapter-title-input" placeholder="Chapter Title">
        <div class="editor-actions">
          <span id="saveIndicator" style="font-size: 0.8rem; color: var(--text-muted);">Synced</span>
        </div>
      </div>

      <div class="editor-textarea-container">
        <textarea id="chapterBody" class="editor-textarea" placeholder="Start drafting your novel chapter here..."></textarea>
      </div>

      <div class="editor-statusbar">
        <div>
          <span id="statusWordCount">0 words</span> | 
          <span id="statusCharCount">0 characters</span>
        </div>
        <div id="statusLastSaved">Unsaved</div>
      </div>
    </main>
  </div>

  <script src="/js/chatbot.js"></script>
  <script src="/js/editor-ui.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/editor-engine.js"></script>
</body>
</html>
